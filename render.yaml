services:
  - type: web
    name: car-photo-bot
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -u car_photo_bot.py"
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
